<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Мой магазин скинов</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a href="#" class="nav-link">Главная</a></li>
                    <li class="nav-item"><a href="#catalog" class="nav-link">Каталог</a></li>
                    <li class="nav-item"><a href="contacts.html" class="nav-link">Контакты</a></li>
                </ul>
                <form class="d-flex">
                    <input type="search" placeholder="Поиск товаров" id="searchInput" class="form-control me-2">
                    <button class="btn btn-outline-light" type="submit">Поиск</button>
                </form>
                <button class="btn btn-light ms-2" id="cartBtn">Корзина (<span id="cartCount">0</span>)</button>
            </div>
        </div>
    </nav>
    <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://avatars.mds.yandex.net/i?id=a614f0f82bf2c85cd8e26239b7eefce8_l-5877464-images-thumbs&n=13" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="https://legalbet.gg/wp-content/uploads/2024/04/photo_2024-04-19_12-25-34-2.jpg" class="d-block w-100" alt="...">
          </div>
          <div class="carousel-item">
            <img src="https://avatars.mds.yandex.net/i?id=db35422b1bc8267c27fbffcbd38d205d_l-7543982-images-thumbs&n=13" class="d-block w-100" alt="...">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Предыдущий</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Следующий</span>
        </button>
      </div>

      <div class="container my-5">
        <h2 class="text-center mb-4" id="catalog">Наши товары</h2>

        <div class="row mb-3">
          <div class="col-mb-3">
            <select calss="formSelect" id="priceFilter">
              <option value="">Все цены</option>
              <option value="0-2000">До 2000 руб.</option>
              <option value="2000-2100">2000-2100 руб.</option>
              <option value="2500+">Более 2500 руб.</option>
            </select>
          </div>
        </div>  
        <div class="row" id="productGrid">
            <div class="col-md-3 mb-4">
                <div class="card" style="width: 18rem;">
                    <img class="card-img-top showDetails" src="https://avatars.mds.yandex.net/i?id=a614f0f82bf2c85cd8e26239b7eefce8_l-5877464-images-thumbs&n=13"  alt="...">
                    <div class="card-body">
                      <h5 class="card-title">АРКАНА НА ПУДЖА🥶🥵😱🥶</h5>
                      <p class="card-text">1999₽</p>
                      <button class="btn btn-primary w-100 addToCart" data-product="ПУДЖЖЖ" data-price="1999">Добавить в корзину</button>
                    </div>
                  </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card" style="width: 18rem;">
                    <img src="https://avatars.mds.yandex.net/i?id=cf326c429545e91489a0b1d1abdf11eab4e614c5-12011291-images-thumbs&n=13" class="card-img-top" alt="...">
                    <div class="card-body">
                      <h5 class="card-title">АРКАНА НА СФА😈😈😈</h5>
                      <p class="card-text">2599₽</p>
                      <button class="btn btn-primary w-100 addToCart" data-product="СФ" data-price="2599">Добавить в корзину</button>
                    </div>
                  </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card" style="width: 18rem;">
                    <img src="https://avatars.mds.yandex.net/i?id=bf64353311fdc8709b5e3320f830bd3b_l-5086883-images-thumbs&n=13" class="card-img-top" alt="...">
                    <div class="card-body">
                      <h5 class="card-title">АРКАНА НА МК🐒🐒🐒🐒</h5>
                      <p class="card-text">2099₽</p>
                      <button class="btn btn-primary w-100 addToCart" data-product="МК" data-price="2099">Добавить в корзину</button>
                    </div>
                  </div>
            </div>
            <div class="col-md-3 mb-4">
                <div class="card" style="width: 18rem;">
                    <img src="https://avatars.mds.yandex.net/i?id=3600814580bd73aca43ec70a68e73f5c_l-4235460-images-thumbs&n=13" class="card-img-top" alt="...">
                    <div class="card-body">
                      <h5 class="card-title">АРКАНА НА РУБИКА🧐🤓🤓🧐</h5>
                      <p class="card-text" id="price">2599₽</p>
                      <button class="btn btn-primary w-100 addToCart" data-product="РУБИК" data-price="2599">Добавить в корзину</button>
                    </div>
                  </div>
            </div>
        </div>
        <div class="modal fade" id="productModal" tabindex="-1">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Детали товара</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
              </div>
              <div class="modal-body" id="modalBody">
                <p>Здесь идет основной текст модального окна</p>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                <button type="button" class="btn btn-primary" id="buyBtn">Купить</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
      <script>
        document.querySelectorAll('.card-title').forEach(title =>{
          title.addEventListener('click', function() {
            const productName = this.textContent;
            const price = this.parentElement.querySelector('button').dataset.price;
            document.getElementById('modalTitle').textContent = productName;
            document.getElementById('modalBody').innerHTML = `Цена: ${price} руб. <br> Это супер товар!`;
             var myModal = new bootstrap.Modal(document.getElementById('productModal'));
             myModal.show();
          })
        })
        document.getElementById('buyBtn').addEventListener('click', function(){
          alert('Товар куплен! Спасибо!');
        })

        document.getElementById('priceFilter').addEventListener('change', function(){
          const filter = this.value;
          const cards = document.querySelectorAll('#productGrid .card');
          cards.forEach(card=>{
            const price = parseInt(card.querySelector('button').dataset.price);
            if(filter === ''){
              card.parentElement.style.display = 'block';
            }
            else if(filter === '0-2000' && price <= 2000) {
              card.parentElement.style.display = 'block';
            }
            else if(filter === '2000-2100' && price > 2000 && price <= 2100) {
              card.parentElement.style.display = 'block';
            }
            else if(filter === '2500+' && price > 2500) {
              card.parentElement.style.display = 'block';
            }
            else {
              card.parentElement.style.display = 'none';
            }
          });
          
        });


      let cart = JSON.parse(localStorage.getItem('cart')) || [];

        document.getElementById('cartCount').textContent = cart.length;

        document.querySelectorAll('.addToCart').forEach(btn => {
         btn.addEventListener('click', function() {
            const product = this.dataset.product;
            const price = parseInt(this.dataset.price);
            cart.push({product, price});
            localStorage.setItem('cart', JSON.stringify(cart));
             document.getElementById('cartCount').textContent = cart.length;
             alert(`${product} Добавлен в корзину!`);
         });
    });

    document.getElementById('cartBtn').addEventListener('click', function(){
      if (cart.length === 0){
        alert('корзина пустая!');
      } else {
          let total = cart.reduce((sum, item) => sum + item.price, 0);
          alert(`В корзине: ${cart.map(item => item.product).join(', ')} \nИтого: ${total} руб. `);
      }
    });
    
      </script>
  </body>
</html>
